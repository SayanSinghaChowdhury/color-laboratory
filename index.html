<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />

		<link
			rel="stylesheet"
			href="style.css" />
		<title>Document</title>
	</head>
	<body>
		<main class="container">
			<!-- Header -->
			<header class="header">
				<h1 class="title">
					Pick Your <span class="font-color">Color</span>
				</h1>

				<div class="hero">
					<img
						style="border-radius: 200px"
						src="./OE3T340.jpg"
						alt="Color Palette Logo"
						class="logo" />

					<h2 class="font-color">toCollaboratory</h2>
				</div>
			</header>

			<!-- Format Buttons -->
			<div class="format-buttons">
				<button class="format-btn active">RGB</button>

				<button class="format-btn">HEX</button>
			</div>

			<!-- Color Palette -->
			<section class="palette-container">
				<div class="color-card">
					<div class="color-preview"></div>
					<p class="color-value">#32A852</p>
				</div>

				<div class="color-card">
					<div class="color-preview"></div>
					<p class="color-value">50, 168, 82</p>
				</div>

				<div class="color-card">
					<div class="color-preview"></div>
					<p class="color-value">#32A852</p>
				</div>

				<div class="color-card">
					<div class="color-preview"></div>
					<p class="color-value">#32A852</p>
				</div>

				<div class="color-card">
					<div class="color-preview"></div>
					<p class="color-value">#32A852</p>
				</div>

				<div class="color-card">
					<div class="color-preview"></div>
					<p class="color-value">#32A852</p>
				</div>
			</section>
		</main>
	</body>
</html>
